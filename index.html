/* ---------- Teilen & Export ---------- */
function rr(x, X, Y, w, h, r) { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }
function fit(x, text, max) { if (x.measureText(text).width <= max) return text; let t = text; while (t.length > 1 && x.measureText(t + '…').width > max) t = t.slice(0, -1); return t + '…'; }
function drawCrown(x, cx, cy, s, color) {
  const k = s / 24; x.save(); x.translate(cx - 12 * k, cy - 12 * k); x.scale(k, k); x.fillStyle = color;
  x.beginPath(); x.moveTo(3, 7.5); x.lineTo(7.6, 11.7); x.lineTo(12, 4.5); x.lineTo(16.4, 11.7); x.lineTo(21, 7.5); x.lineTo(19.2, 18); x.lineTo(4.8, 18); x.closePath(); x.fill();
  rr(x, 4.8, 19.2, 14.4, 2, 1); x.fill(); x.restore();
}
function drawCard(sm) {
  const FEE = sm.hasFee;
  const W = FEE ? 420 : 380, P = 14, CW = W - 2 * P, headH = 226;
  const money = c => FEE ? fmt(c).replace(/\s?€/, '') : fmt(c);
  const colP = FEE ? CW - 200 : CW - 104;
  const F = '-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif';
  const FD = '"Bricolage Grotesque", ' + F;
  const scale = 3, probe = document.createElement('canvas').getContext('2d');
  probe.font = `11.5px ${F}`;
  const footText = (FEE ? 'Beträge in €. ' : '') + (sm.exactLabel || '');
  const footLines = footText.trim() ? wrapLines(probe, footText.trim(), CW - 36) : [];
  const H = P + headH + 40 + sm.present.length * 32 + sm.absent.length * 42 + (sm.absent.length ? 28 : 0) + footLines.length * 15 + 20 + P;
  const c = document.createElement('canvas'); c.width = W * scale; c.height = H * scale;
  const x = c.getContext('2d'); x.scale(scale, scale);
  // Hintergrund mit Bahnlicht
  x.fillStyle = '#0A0A12'; x.fillRect(0, 0, W, H);
  const amb = x.createRadialGradient(0, 0, 0, 0, 0, W); amb.addColorStop(0, 'rgba(255,150,30,0.35)'); amb.addColorStop(1, 'rgba(255,150,30,0)');
  x.fillStyle = amb; x.fillRect(0, 0, W, H);
  x.save(); rr(x, P, P, CW, H - 2 * P, 28); x.clip();
  x.fillStyle = '#14141D'; x.fillRect(P, P, CW, H - 2 * P);
  const hg = x.createLinearGradient(P, P, P + CW * 0.4, P + headH); hg.addColorStop(0, '#2B1A07'); hg.addColorStop(1, '#14141D');
  x.fillStyle = hg; x.fillRect(P, P, CW, headH);
  const g = x.createRadialGradient(P + CW, P, 0, P + CW, P, 230); g.addColorStop(0, 'rgba(255,150,30,0.55)'); g.addColorStop(1, 'rgba(255,150,30,0)');
  x.fillStyle = g; x.fillRect(P, P, CW, headH);
  x.textBaseline = 'alphabetic';
  x.font = `600 11.5px ${F}`; x.fillStyle = 'rgba(255,255,255,0.7)'; x.textAlign = 'left'; x.fillText(sm.dateLabel.toUpperCase(), P + 18, P + 30);
  x.textAlign = 'right'; x.fillText(sm.countLabel.toUpperCase(), P + CW - 18, P + 30); x.textAlign = 'left';
  // Krone
  const glow = x.createRadialGradient(P + 51, P + 94, 20, P + 51, P + 94, 60); glow.addColorStop(0, 'rgba(255,150,30,0.6)'); glow.addColorStop(1, 'rgba(255,150,30,0)');
  x.fillStyle = glow; x.fillRect(P, P + 34, 120, 120);
  const cg = x.createLinearGradient(P + 18, P + 61, P + 84, P + 127); cg.addColorStop(0, '#FFE08A'); cg.addColorStop(0.5, '#FFB020'); cg.addColorStop(1, '#FF7A1A');
  x.fillStyle = cg; x.beginPath(); x.arc(P + 51, P + 94, 33, 0, Math.PI * 2); x.fill();
  drawCrown(x, P + 51, P + 94, 36, '#1A1004');
  x.font = `700 11.5px ${F}`; x.fillStyle = '#FFC861'; x.fillText('PUMPENKÖNIG · HUT AUF', P + 100, P + 76);
  x.font = `800 32px ${FD}`; x.fillStyle = '#FFFFFF'; x.fillText(fit(x, sm.kingName || 'Kein König', CW - 118), P + 100, P + 108);
  if (sm.kingName) { x.font = `13px ${F}`; x.fillStyle = 'rgba(255,255,255,0.72)'; x.fillText(`${sm.kingPumps} Pumpen · ${sm.kingTitles}. Titel in 12 Monaten`, P + 100, P + 128); }
  const chips = FEE ? [['STRAFEN', fmt(sm.total)], ['BEITRÄGE', fmt(sm.feeTotal)], ['KASSE GESAMT', fmt(sm.grand)]] : [['GESAMT', fmt(sm.total)], ['Ø-STRAFE', fmt(sm.avg)], ['PUMPEN', String(sm.pumps)]];
  const cw = (CW - 36 - 16) / 3;
  chips.forEach(([l, v], i) => {
    const cx = P + 18 + i * (cw + 8), cy = P + 150;
    x.fillStyle = 'rgba(255,255,255,0.08)'; rr(x, cx, cy, cw, 58, 16); x.fill();
    x.strokeStyle = 'rgba(255,255,255,0.12)'; x.lineWidth = 1; rr(x, cx + 0.5, cy + 0.5, cw - 1, 57, 16); x.stroke();
    x.textAlign = 'center'; x.font = `600 10.5px ${F}`; x.fillStyle = 'rgba(255,255,255,0.65)'; x.fillText(l, cx + cw / 2, cy + 22);
    x.font = `800 18px ${FD}`; x.fillStyle = '#FFFFFF'; x.fillText(fit(x, v, cw - 8), cx + cw / 2, cy + 45); x.textAlign = 'left';
  });
  let y = P + headH + 26;
  x.font = `700 10.5px ${F}`; x.fillStyle = '#8C8CA0'; x.fillText('KEGLER', P + 42, y);
  x.textAlign = 'right';
  if (FEE) { x.fillText('P', P + colP, y); x.fillText('STRAFE', P + CW - 144, y); x.fillText('BEITRAG', P + CW - 82, y); x.fillText('GESAMT', P + CW - 18, y); }
  else { x.fillText('PUMPEN', P + colP, y); x.fillText('BETRAG', P + CW - 18, y); }
  x.textAlign = 'left';
  y += 10;
  const amounts = (r, base, king) => {
    x.textAlign = 'right'; x.font = `${king ? '800' : '400'} 15px ${F}`; x.fillStyle = king ? '#FFC861' : '#A6A6B8';
    x.fillText(r.rank ? String(r.pumps) : r.mark, P + colP, base);
    if (FEE) {
      x.font = `400 15px ${F}`; x.fillStyle = '#CFCFDA';
      x.fillText(money(r.cents), P + CW - 144, base); x.fillText(money(r.fee), P + CW - 82, base);
      x.font = `700 15px ${F}`; x.fillStyle = '#FFFFFF'; x.fillText(money(r.sum), P + CW - 18, base);
    } else { x.font = `700 15px ${F}`; x.fillStyle = '#FFFFFF'; x.fillText(fmt(r.cents), P + CW - 18, base); }
    x.textAlign = 'left';
  };
  const drawRow = (r, i) => {
    const king = r.rank && r.id === sm.kingId;
    if (king) {
      const kg = x.createLinearGradient(P, 0, P + CW, 0); kg.addColorStop(0, 'rgba(255,176,32,0.28)'); kg.addColorStop(1, 'rgba(255,176,32,0.04)');
      x.fillStyle = kg; x.fillRect(P, y, CW, 32);
    } else if (i % 2) { x.fillStyle = 'rgba(255,255,255,0.025)'; x.fillRect(P, y, CW, 32); }
    x.font = `700 13px ${F}`; x.fillStyle = king ? '#FFC861' : '#8C8CA0'; x.fillText(String(r.rank), P + 18, y + 21);
    x.font = `${king ? '800' : '400'} 15px ${F}`; x.fillStyle = '#F6F5FA';
    const nm = fit(x, r.name, (colP - 70) - (r.tag ? 50 : 0)); x.fillText(nm, P + 42, y + 21);
    if (r.tag) {
      const nx = P + 42 + x.measureText(nm).width + 6; x.font = `700 10.5px ${F}`;
      const tw = x.measureText(r.tag).width + 12;
      x.fillStyle = 'rgba(61,139,255,0.22)'; rr(x, nx, y + 9, tw, 17, 8.5); x.fill(); x.fillStyle = '#86BDFF'; x.fillText(r.tag, nx + 6, y + 21.5);
    }
    amounts(r, y + 21, king);
    y += 32;
  };
  const drawAbsent = r => {
    x.font = `500 15px ${F}`; x.fillStyle = '#F6F5FA'; x.fillText(fit(x, r.name, colP - 70), P + 42, y + 18);
    x.font = `${r.streak >= 3 ? '700' : '400'} 11.5px ${F}`; x.fillStyle = r.streak >= 3 ? '#FF8A80' : '#A6A6B8';
    x.fillText(fit(x, r.subline, colP - 50), P + 42, y + 34);
    amounts(r, y + 25, false);
    y += 42;
  };
  sm.present.forEach(drawRow);
  if (sm.absent.length) { x.font = `700 10.5px ${F}`; x.fillStyle = '#8C8CA0'; x.fillText('ABWESEND', P + 18, y + 19); y += 28; sm.absent.forEach(drawAbsent); }
  if (footLines.length) { y += 14; x.font = `11.5px ${F}`; x.fillStyle = '#8C8CA0'; footLines.forEach(l => { x.fillText(l, P + 18, y); y += 15; }); }
  x.restore();
  x.strokeStyle = 'rgba(255,176,32,0.25)'; x.lineWidth = 1; rr(x, P + 0.5, P + 0.5, CW - 1, H - 2 * P - 1, 28); x.stroke();
  return c;
}
function wrapLines(x, text, max) {
  const words = text.split(' '); const lines = []; let cur = '';
  words.forEach(w => { const t = cur ? cur + ' ' + w : w; if (x.measureText(t).width > max && cur) { lines.push(cur); cur = w; } else cur = t; });
  if (cur) lines.push(cur); return lines;
}
async function shareFile(blob, name, fallback) {
  try {
    const file = new File([blob], name, {type: blob.type});
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file]}); return; }
  } catch (err) { if (err && err.name === 'AbortError') return; }
  fallback();
}
async function shareResult(e) {
  const c = drawCard(summary(e));
  const url = c.toDataURL('image/png');
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  if (!blob) { ui.sheet = {type: 'image', url}; render(); return; }
  await shareFile(blob, `Kegelabend-${e.date}.png`, () => { ui.sheet = {type: 'image', url}; render(); });
}
function exportText(text, name, mime, title, hint) {
  shareFile(new Blob([text], {type: mime}), name, () => { ui.sheet = {type: 'text', title, hint, text}; render(); });
}
function csv() {
  const lines = ['Datum;Uhrzeit;Spieler;Gast;Strafe;Betrag;Pumpe;Quelle;Storniert'];
  [...db.events].sort((a, b) => a.date.localeCompare(b.date)).forEach(e => e.entries.slice().sort((a, b) => a.ts - b.ts).forEach(x => {
    const p = player(x.playerId);
    lines.push([fmtDate(e.date, {day: '2-digit', month: '2-digit', year: 'numeric'}), new Date(x.ts).toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'}),
      p ? p.name : '', p && p.isGuest ? 'ja' : 'nein', x.name, editMoney(x.amountCents), x.isPump ? 'ja' : 'nein', x.source, x.isVoided ? 'ja' : 'nein']
      .map(v => String(v).replace(/;/g, ',')).join(';'));
  }));
  return lines.join('\n');
}

/* ---------- Beispielclub ---------- */
function loadDemo() {
  const names = ['Andreas', 'Frank', 'Jörg', 'Markus', 'Michael', 'Philipp', 'Stefan', 'Thomas'];
  const ps = names.map(n => ({id: uid(), name: n, isGuest: false, isArchived: false, createdAt: Date.now()}));
  const klaus = {id: uid(), name: 'Klaus', isGuest: true, isArchived: false, createdAt: Date.now()};
  db.players.push(...ps, klaus);
  db.settings.feeCents = 1000; db.settings.feeMode = 'month';
  const [pumpe, spiel, klingel] = quickTypes();
  let seed = 11; const rnd = n => { seed = (seed * 9301 + 49297) % 233280; return Math.floor(seed / 233280 * n); };
  [28, 14, 7].forEach((daysAgo, i) => {
    const d = new Date(); d.setDate(d.getDate() - daysAgo);
    const e = {id: uid(), date: isoOf(d), status: 'live', startedAt: d.getTime(), closedAt: null, averageCents: null, kingId: null, attendances: [], entries: []};
    ps.forEach(p => {
      let st = 'present';
      if (p.name === 'Jörg' && i >= 1) st = i === 1 ? 'excused' : 'unexcused';
      if (p.name === 'Michael' && i === 2) st = 'excused';
      e.attendances.push({playerId: p.id, status: st});
    });
    if (i === 2) e.attendances.push({playerId: klaus.id, status: 'present'});
    present(e).forEach(p => {
      [[pumpe, 6], [spiel, 4], [klingel, 5]].forEach(([t, max]) => { if (!t) return; const n = rnd(max); for (let k = 0; k < n; k++) e.entries.push(mkEntry(p.id, t.name, t.amountCents, t.countsAsPump, 'manual', uid(), t.id)); });
    });
    db.events.push(e);
    const c = kingCandidates(e);
    closeEvent(e, c.length ? c[0].id : null);
  });
  save();
}

/* ---------- Aktionen ---------- */
const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
const checked = id => { const el = document.getElementById(id); return !!(el && el.checked); };
const curEvent = () => { const s = screen(); return evById(s.eventId); };
const exitSelect = () => { ui.selecting = false; ui.selection = new Set(); };

const A = {
  tab: d => { ui.tab = d.v; ui.stack = []; ui.sheet = null; exitSelect(); render(); },
  back: () => { ui.stack.pop(); exitSelect(); ui.sheet = null; render(); },
  sheetClose: () => { ui.sheet = null; render(); },
  open: d => { const e = evById(d.id); if (e) push({name: e.status === 'live' ? 'live' : 'result', eventId: e.id}); },
  newEvent: () => {
    const live = db.events.find(e => e.status === 'live');
    if (live) { push({name: 'live', eventId: live.id}); return; }
    ui.setup = {date: todayISO(), statuses: {}, guests: []}; push({name: 'setup'});
  },
  setStatus: d => { ui.setup.statuses[d.pid] = d.v; render(); },
  guestSheet: () => { ui.sheet = {type: 'guest'}; ui.focus = 'guestName'; render(); },
  addKnownGuest: d => { ui.setup.guests.push(d.pid); ui.sheet = null; render(); },
  addNewGuest: () => {
    const name = val('guestName').trim(); if (!name) return;
    const g = {id: uid(), name, isGuest: true, isArchived: false, createdAt: Date.now()};
    db.players.push(g); save(); ui.setup.guests.push(g.id); ui.sheet = null; render();
  },
  removeGuest: d => { ui.setup.guests = ui.setup.guests.filter(id => id !== d.pid); render(); },
  startEvent: () => {
    const st = ui.setup;
    const e = {id: uid(), date: st.date, status: 'live', startedAt: Date.now(), closedAt: null, averageCents: null, kingId: null, attendances: [], entries: []};
    activeMembers().forEach(p => e.attendances.push({playerId: p.id, status: st.statuses[p.id] || 'present'}));
    st.guests.forEach(id => e.attendances.push({playerId: id, status: 'present'}));
    db.events.push(e); save();
    replaceTop({name: 'live', eventId: e.id}); render();
  },
  detail: d => push({name: 'detail', eventId: screen().eventId, pid: d.pid}),
  quick: d => {
    const e = curEvent(), t = typeById(d.t), p = player(d.pid);
    if (!e || !t || !p) return;
    if (t.askAmount) { askAmount(e, t, [p.id]); return; }
    book(e, t, [p]); render();
  },
  amountBook: d => {
    const sh = ui.sheet, e = evById(sh.eventId), t = typeById(sh.typeId);
    const cents = d.v != null ? Number(d.v) : parseMoney(val('amountInput'));
    if (!cents) { const el = document.getElementById('amountInput'); if (el) el.focus(); return; }
    book(e, t, sh.pids.map(player).filter(Boolean), cents); ui.sheet = null; exitSelect(); render();
  },
  feeSheet: () => { ui.sheet = {type: 'fee'}; render(); },
  saveFee: () => {
    const c = parseMoney(val('feeAmount'));
    if (c == null) { document.getElementById('feeAmount').focus(); return; }
    db.settings.feeCents = c; db.settings.feeMode = val('feeMode'); save(); ui.sheet = null; render();
  },
  more: d => { ui.sheet = {type: 'more', eventId: screen().eventId, pids: [d.pid]}; render(); },
  sortRank: d => { ui.sortRank = d.v === '1'; render(); },
  selStart: () => { ui.selecting = true; ui.toast = null; render(); },
  selCancel: () => { exitSelect(); render(); },
  selAll: () => { const e = curEvent(); ui.selection = new Set(present(e).map(p => p.id)); render(); },
  selToggle: d => { ui.selection.has(d.pid) ? ui.selection.delete(d.pid) : ui.selection.add(d.pid); render(); },
  selBook: d => {
    const e = curEvent(), t = typeById(d.t); const ps = present(e).filter(p => ui.selection.has(p.id));
    if (!ps.length || !t) return;
    if (t.askAmount) { askAmount(e, t, ps.map(p => p.id)); return; }
    book(e, t, ps); exitSelect(); render();
  },
  selMore: () => { const e = curEvent(); const pids = present(e).filter(p => ui.selection.has(p.id)).map(p => p.id); if (pids.length) { ui.sheet = {type: 'more', eventId: e.id, pids}; render(); } },
  moreBook: d => {
    const sh = ui.sheet, e = evById(sh.eventId), t = typeById(d.t);
    if (t.askAmount) { askAmount(e, t, sh.pids); return; }
    book(e, t, sh.pids.map(player).filter(Boolean)); ui.sheet = null; exitSelect(); render();
  },
  otherBook: () => {
    const sh = ui.sheet, e = evById(sh.eventId);
    const name = val('otherName').trim(), cents = parseMoney(val('otherAmount'));
    if (!name) { ui.focus = 'otherName'; document.getElementById('otherName').focus(); return; }
    if (!cents) { document.getElementById('otherAmount').focus(); return; }
    if (checked('otherCat')) db.types.push(T(name, cents, '', 'gray', 'more', 'player', false, null, Math.max(0, ...db.types.map(t => t.sortOrder)) + 1));
    bookOther(e, name, cents, sh.pids.map(player).filter(Boolean)); ui.sheet = null; exitSelect(); render();
  },
  undo: () => {
    const t = ui.toast; if (!t) return;
    const e = evById(t.eventId); if (e) { e.entries = e.entries.filter(x => x.groupId !== t.groupId); save(); }
    ui.toast = null; clearTimeout(toastTimer); render();
  },
  closeAsk: () => { ui.sheet = {type: 'closeAsk'}; render(); },
  closeDo: () => {
    const e = curEvent(); const c = kingCandidates(e);
    if (c.length > 1) { ui.sheet = {type: 'tie', eventId: e.id, pids: c.map(p => p.id)}; render(); return; }
    finishClose(e, c[0] ? c[0].id : null);
  },
  closeKing: d => finishClose(curEvent(), d.pid),
  void: d => { const e = curEvent(); const x = e.entries.find(y => y.id === d.id); if (x) { x.isVoided = !x.isVoided; save(); render(); } },
  share: () => { const e = curEvent(); if (e) shareResult(e); },
  resultMenu: () => { ui.sheet = {type: 'resultMenu'}; render(); },
  reopenAsk: () => { ui.sheet = {type: 'confirm', title: 'Abend wieder öffnen?', text: 'Durchschnittsstrafe und Pumpenkönig werden beim erneuten Schließen neu berechnet.', label: 'Wieder öffnen', act: 'reopen'}; render(); },
  deleteAsk: () => { ui.sheet = {type: 'confirm', title: 'Abend löschen?', text: 'Alle Buchungen dieses Abends werden endgültig entfernt.', label: 'Endgültig löschen', danger: true, act: 'deleteEvent'}; render(); },
  resetAsk: () => { ui.sheet = {type: 'confirm', title: 'Alles zurücksetzen?', text: 'Spieler, Katalog und alle Abende werden auf diesem Gerät gelöscht. Sichere vorher ein Backup.', label: 'Alles löschen', danger: true, act: 'reset'}; render(); },
  confirmDo: () => {
    const act = ui.sheet.act; ui.sheet = null;
    if (act === 'reopen') { const e = curEvent(); reopenEvent(e); replaceTop({name: 'live', eventId: e.id}); }
    if (act === 'deleteEvent') { const e = curEvent(); db.events = db.events.filter(x => x !== e); save(); ui.stack.pop(); }
    if (act === 'reset') { db = emptyDb(); save(); ui.stack = []; ui.tab = 'events'; }
    render();
  },
  dataMenu: () => { ui.sheet = {type: 'dataMenu'}; render(); },
  exportBackup: () => exportText(JSON.stringify(db, null, 1), `Kegelkasse-Backup-${todayISO()}.json`, 'application/json', 'Backup', 'Text kopieren und sicher ablegen, z. B. in einer Notiz.'),
  exportCsv: () => exportText(csv(), `Kegelkasse-${todayISO()}.csv`, 'text/csv', 'CSV-Export', 'Text kopieren und in Numbers oder Excel einfügen.'),
  importBackup: () => document.getElementById('importFile').click(),
  copyText: async () => {
    const ta = document.getElementById('exportText');
    try { await navigator.clipboard.writeText(ta.value); ui.sheet = null; render(); } catch (e) { ta.focus(); ta.select(); }
  },
  demo: () => { loadDemo(); ui.sheet = null; ui.tab = 'events'; ui.stack = []; render(); },
  newType: () => { ui.sheet = {type: 'typeEdit', id: null}; ui.focus = 'tName'; render(); },
  editType: d => { ui.sheet = {type: 'typeEdit', id: d.id}; render(); },
  saveType: () => {
    const sh = ui.sheet;
    const name = val('tName').trim(); if (!name) { document.getElementById('tName').focus(); return; }
    let t = sh.id ? typeById(sh.id) : null;
    if (!t) { t = T(name, 0, '', 'blue', 'more', 'player', false, null, Math.max(0, ...db.types.map(x => x.sortOrder)) + 1); db.types.push(t); }
    t.name = name;
    if (t.systemKind !== 'average') { const c = parseMoney(val('tAmount')); if (c == null) { document.getElementById('tAmount').focus(); return; } t.amountCents = c; }
    t.isActive = checked('tActive');
    if (!t.systemKind) {
      t.category = val('tCat'); t.recipient = val('tRec'); t.color = val('tColor');
      t.short = val('tShort').trim().toUpperCase(); t.countsAsPump = checked('tPump'); t.askAmount = checked('tAsk');
    }
    save(); ui.sheet = null; render();
  },
  moveType: d => {
    const t = typeById(ui.sheet.id); const list = sortedTypes().filter(x => x.category === t.category);
    const i = list.indexOf(t), j = i + Number(d.v);
    if (j < 0 || j >= list.length) return;
    const o = list[j].sortOrder; list[j].sortOrder = t.sortOrder; t.sortOrder = o;
    if (list[j].sortOrder === t.sortOrder) t.sortOrder += Number(d.v);
    save(); render();
  },
  deleteType: () => { db.types = db.types.filter(t => t.id !== ui.sheet.id); save(); ui.sheet = null; render(); },
  addPlayerSheet: () => { ui.sheet = {type: 'addPlayer'}; ui.focus = 'newPlayer'; render(); },
  addPlayer: () => {
    const name = val('newPlayer').trim(); if (!name) return;
    db.players.push({id: uid(), name, isGuest: false, isArchived: false, createdAt: Date.now()}); save();
    ui.sheet = {type: 'addPlayer'}; ui.focus = 'newPlayer'; render();
  },
  playerSheet: d => { ui.sheet = {type: 'player', pid: d.pid}; render(); },
  savePlayer: () => { const p = player(ui.sheet.pid), n = val('pName').trim(); if (p && n) { p.name = n; save(); } ui.sheet = null; render(); },
  promote: () => { const p = player(ui.sheet.pid); p.isGuest = false; save(); ui.sheet = null; render(); },
  archive: () => { const p = player(ui.sheet.pid); p.isArchived = !p.isArchived; save(); ui.sheet = null; render(); },
  kingPeriod: d => { ui.kingPeriod = d.v; render(); }
};
function askAmount(e, t, pids) {
  ui.sheet = {type: 'amount', eventId: e.id, typeId: t.id, pids};
  render();
}
function finishClose(e, kingId) {
  closeEvent(e, kingId);
  ui.sheet = null; ui.toast = null; exitSelect();
  replaceTop({name: 'result', eventId: e.id});
  render();
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click', ev => {
  if (ev.target.classList && ev.target.classList.contains('sheet-bg')) { ui.sheet = null; render(); return; }
  const el = ev.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if (fn) { ev.preventDefault(); fn(el.dataset, el); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'setupDate' && ui.setup) { ui.setup.date = t.value || todayISO(); render(); }
  if (t.id === 'importFile' && t.files && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!isDb(d)) throw new Error('format');
        db = migrate(d); save(); ui.stack = []; ui.tab = 'events'; ui.sheet = null; render();
      } catch (e) { ui.sheet = {type: 'confirm', title: 'Backup nicht lesbar', text: 'Die Datei ist kein Kegelkasse-Backup. Wähle die JSON-Datei, die du mit „Backup sichern“ erstellt hast.', label: 'OK', act: 'none'}; render(); }
    };
    r.readAsText(t.files[0]); t.value = '';
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && ui.sheet) { ui.sheet = null; render(); return; }
  if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.enter) { ev.preventDefault(); const fn = A[ev.target.dataset.enter]; if (fn) fn({}); }
});

/* Offline-Fähigkeit, wenn als eigene Web-App gehostet */
if ('serviceWorker' in navigator && location.protocol === 'https:' && window.KEGELKASSE_PWA) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

render();
})();
